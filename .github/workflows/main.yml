# ==========================================
# FDR - WINDOWS 11 RDP AUTO SETUP
# ==========================================

# Administrator check
$currentUser = [Security.Principal.WindowsIdentity]::GetCurrent()
$principal = New-Object Security.Principal.WindowsPrincipal($currentUser)

if (!$principal.IsInRole(
    [Security.Principal.WindowsBuiltInRole]::Administrator
)) {
    Write-Host "ERROR: Run PowerShell as Administrator"
    exit 1
}

Write-Host "Starting FDR RDP Setup..." -ForegroundColor Cyan

# 1. Check Windows edition
$edition = (Get-ComputerInfo).WindowsProductName
Write-Host "Windows: $edition"

if ($edition -notmatch "Pro|Enterprise|Education") {
    Write-Host "Windows Home cannot host Microsoft's built-in RDP."
    exit 1
}

# 2. Check hardware
$ram = [math]::Round(
    (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2
)
$disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
$diskSize = [math]::Round($disk.Size / 1GB, 2)

Write-Host "RAM: $ram GB"
Write-Host "C Drive: $diskSize GB"

# 3. Generate random username
$randomID = [guid]::NewGuid().ToString("N").Substring(0,8)
$username = "FDR" + $randomID

# 4. Generate strong random password
$chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*"
$password = -join (1..24 | ForEach-Object {
    $chars[[Security.Cryptography.RandomNumberGenerator]::GetInt32($chars.Length)]
})

# 5. Create local RDP account
$securePassword = ConvertTo-SecureString $password -AsPlainText -Force

New-LocalUser -Name $username `
    -Password $securePassword `
    -FullName "FDR Remote User" `
    -Description "FDR RDP Account" `
    -PasswordNeverExpires `
    -AccountNeverExpires

# Add user to Remote Desktop Users
$rdpGroup = Get-LocalGroup -SID "S-1-5-32-555"
Add-LocalGroupMember -Group $rdpGroup -Member $username

# 6. Enable Remote Desktop
Set-ItemProperty `
    -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
    -Name "fDenyTSConnections" -Value 0

# 7. Enable Network Level Authentication
Set-ItemProperty `
    -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
    -Name "UserAuthentication" -Value 1

# 8. Start Remote Desktop service
Set-Service -Name TermService -StartupType Automatic
Start-Service -Name TermService

# 9. Enable Windows RDP firewall rules
Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

# 10. Install Tailscale if missing
if (!(Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue)) {
    if (Get-Command winget -ErrorAction SilentlyContinue) {
        winget install --id Tailscale.Tailscale -e --silent `
            --accept-package-agreements --accept-source-agreements
    } else {
        Write-Host "Install Tailscale manually from tailscale.com"
    }
}

# 11. Check Tailscale service
$ts = Get-Service -Name Tailscale -ErrorAction SilentlyContinue

if ($ts) {
    Set-Service -Name Tailscale -StartupType Automatic
    Start-Service -Name Tailscale -ErrorAction SilentlyContinue
}

# 12. Check RDP listener
Start-Sleep -Seconds 3
$listener = Get-NetTCPConnection `
    -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue

# 13. Display credentials
Write-Host ""
Write-Host "========== FDR RDP DETAILS ==========" -ForegroundColor Green
Write-Host "Username: $username"
Write-Host "Password: $password"
Write-Host "RDP Port: 3389"
Write-Host "RAM: $ram GB"
Write-Host "Disk: $diskSize GB"
Write-Host "RDP Listening: $([bool]$listener)"

Write-Host ""
Write-Host "Tailscale status:"
if (Get-Command tailscale -ErrorAction SilentlyContinue) {
    tailscale status
    tailscale ip -4
} else {
    Write-Host "Tailscale installation/sign-in still required."
}

Write-Host ""
Write-Host "Setup completed. Reboot if required."
Write-Host "Keep your password private."


name: FDR Windows RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Configure Windows RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring Windows RDP..."

          $Username = "FDRUser"
          $Chars = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*"

          $Password = -join (1..24 | ForEach-Object {
            $Chars[(Get-Random -Maximum $Chars.Length)]
          })

          $SecurePassword = ConvertTo-SecureString $Password -AsPlainText -Force

          $ExistingUser = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue

          if ($ExistingUser) {
            Set-LocalUser -Name $Username -Password $SecurePassword
          }
          else {
            New-LocalUser -Name $Username `
              -Password $SecurePassword `
              -Description "FDR Remote Desktop User"
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          # Start Remote Desktop service
          Set-Service -Name TermService -StartupType Manual
          Start-Service -Name TermService

          # Enable RDP firewall rules
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" |
            Set-NetFirewallRule -Enabled True -Profile Any

          # Ensure Windows Firewall is enabled
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True

          # Save connection information
          "RDP_USERNAME=$Username" >> $env:GITHUB_ENV

          # Mask password in workflow logs
          Write-Output "::add-mask::$Password"

          # Show password in private workflow summary
          # Anyone with access to this run may be able to read it.
          "RDP_PASSWORD=$Password" >> $env:GITHUB_STEP_SUMMARY

          "## FDR Windows RDP" >> $env:GITHUB_STEP_SUMMARY
          "Username: $Username" >> $env:GITHUB_STEP_SUMMARY
          "Password: $Password" >> $env:GITHUB_STEP_SUMMARY
          "RDP Port: 3389" >> $env:GITHUB_STEP_SUMMARY

          Write-Host "RDP configuration completed."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Installer = "$env:TEMP\tailscale-setup.exe"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $Installer

          Start-Process -FilePath $Installer `
            -ArgumentList "/quiet" -Wait

          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $Tailscale)) {
            throw "Tailscale installation failed."
          }

          $Service = Get-Service -Name Tailscale

          if ($Service.Status -ne "Running") {
            Start-Service -Name Tailscale
          }

          Write-Host "Tailscale installed and service started."

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $Tailscale up `
            --authkey=$env:TAILSCALE_AUTHKEY `
            --hostname=fdr-github-windows `
            --accept-dns=true `
            --unattended

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          Start-Sleep -Seconds 10

          $IP = (& $Tailscale ip -4 | Select-Object -First 1).Trim()

          if (!$IP) {
            throw "Tailscale IP unavailable."
          }

          "TAILSCALE_IP=$IP" >> $env:GITHUB_ENV

          "Tailscale IP: $IP" >> $env:GITHUB_STEP_SUMMARY

          Write-Host "Tailscale connected: $IP"

      - name: Verify RDP and Network
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking Remote Desktop..."

          $Service = Get-Service TermService

          if ($Service.Status -ne "Running") {
            Start-Service TermService
          }

          $Listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (!$Listener) {
            throw "RDP port 3389 is not listening."
          }

          Write-Host "RDP PORT 3389: ACTIVE"
          Write-Host "RDP SERVICE: RUNNING"
          Write-Host "TAILSCALE IP: $env:TAILSCALE_IP"

          "RDP Status: ACTIVE" >> $env:GITHUB_STEP_SUMMARY
          "Computer: $env:COMPUTERNAME" >> $env:GITHUB_STEP_SUMMARY
          "Network: Tailscale connected" >> $env:GITHUB_STEP_SUMMARY

      - name: Keep RDP Session Alive
        shell: pwsh
        run: |
          Write-Host "FDR Windows RDP is running."
          Write-Host "The session ends when GitHub stops the runner."

          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "FDR RDP is still running: $(Get-Date)"
          }


name: FDR Windows RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-rdp:
    name: FDR Live Windows RDP
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      # 1. Create RDP user and enable Windows RDP
      - name: Configure Windows RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Starting FDR Windows configuration"

          $Username = "FDRUser"
          $Chars = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*"

          $Password = -join (1..24 | ForEach-Object {
            $Chars[(Get-Random -Maximum $Chars.Length)]
          })

          $SecurePassword = ConvertTo-SecureString $Password -AsPlainText -Force

          $User = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue

          if ($User) {
            Set-LocalUser -Name $Username -Password $SecurePassword
          } else {
            New-LocalUser -Name $Username `
              -Password $SecurePassword `
              -Description "FDR Remote Desktop Account"
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          # Start RDP service
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          # Enable firewall
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True

          Get-NetFirewallRule -DisplayGroup "Remote Desktop" |
            Set-NetFirewallRule -Enabled True -Profile Any

          # Explicit RDP inbound rule
          if (!(Get-NetFirewallRule -Name "FDR-RDP-3389" -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule `
              -Name "FDR-RDP-3389" `
              -DisplayName "FDR Remote Desktop TCP 3389" `
              -Direction Inbound `
              -Protocol TCP `
              -LocalPort 3389 `
              -Action Allow `
              -Profile Any
          }

          # Mask password in logs
          Write-Output "::add-mask::$Password"

          # Save credentials in the private workflow summary
          "## FDR RDP Credentials" >> $env:GITHUB_STEP_SUMMARY
          "Username: $Username" >> $env:GITHUB_STEP_SUMMARY
          "Password: $Password" >> $env:GITHUB_STEP_SUMMARY
          "Port: 3389" >> $env:GITHUB_STEP_SUMMARY

          "RDP_USERNAME=$Username" >> $env:GITHUB_ENV

          Write-Host "RDP user configured."

      # 2. Install Tailscale
      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Installer = "$env:TEMP\tailscale-setup.exe"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $Installer

          Start-Process -FilePath $Installer `
            -ArgumentList "/quiet" -Wait

          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $Tailscale)) {
            throw "Tailscale installation failed."
          }

          $Service = Get-Service -Name Tailscale -ErrorAction Stop

          if ($Service.Status -ne "Running") {
            Start-Service -Name Tailscale
          }

          Write-Host "Tailscale installed successfully."

      # 3. Connect to your Tailscale network
      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "Missing GitHub secret TAILSCALE_AUTHKEY."
          }

          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $Tailscale up `
            "--authkey=$env:TAILSCALE_AUTHKEY" `
            "--hostname=fdr-github-windows" `
            "--accept-dns=true" `
            "--unattended"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale authentication failed."
          }

          Start-Sleep -Seconds 10

          $IP = (& $Tailscale ip -4 | Select-Object -First 1).Trim()

          if (!$IP) {
            throw "Tailscale IP not found."
          }

          "TAILSCALE_IP=$IP" >> $env:GITHUB_ENV

          "## Network Connection" >> $env:GITHUB_STEP_SUMMARY
          "Tailscale IP: $IP" >> $env:GITHUB_STEP_SUMMARY

          Write-Host "Tailscale IP: $IP"

      # 4. Verify RDP and network
      - name: Verify RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking RDP service..."

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          if ((Get-Service TermService).Status -ne "Running") {
            Start-Service TermService
          }

          $Listener = $null

          for ($i = 1; $i -le 15; $i++) {
            $Listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($Listener) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (!$Listener) {
            throw "RDP port 3389 is not listening."
          }

          $Test = Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (!$Test.TcpTestSucceeded) {
            throw "Local RDP network test failed."
          }

          Write-Host "RDP SERVICE: RUNNING"
          Write-Host "RDP PORT: OPEN"
          Write-Host "LOCAL NETWORK TEST: PASSED"
          Write-Host "TAILSCALE IP: $env:TAILSCALE_IP"

          "RDP Status: ACTIVE" >> $env:GITHUB_STEP_SUMMARY
          "Port 3389: LISTENING" >> $env:GITHUB_STEP_SUMMARY
          "Local test: PASSED" >> $env:GITHUB_STEP_SUMMARY

      # 5. Keep the GitHub runner active
      - name: Keep FDR RDP Session Live
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===================================="
          Write-Host "FDR WINDOWS RDP SESSION IS RUNNING"
          Write-Host "===================================="

          while ($true) {

            $Service = Get-Service TermService

            if ($Service.Status -ne "Running") {
              Start-Service TermService
            }

            $Listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            Write-Host "Time: $(Get-Date)"
            Write-Host "Computer: $env:COMPUTERNAME"
            Write-Host "RDP Service: $((Get-Service TermService).Status)"
            Write-Host "RDP Port: $(if ($Listener) {'LISTENING'} else {'NOT LISTENING'})"
            Write-Host "Tailscale IP: $env:TAILSCALE_IP"

            if (!$Listener) {
              Write-Host "WARNING: RDP listener unavailable."
            }

            Start-Sleep -Seconds 30
          }

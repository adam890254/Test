
name: FDR Windows 11 USA RDP - Complete Setup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fdr-windows-rdp
  cancel-in-progress: false

jobs:
  windows-rdp:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:

      # STEP 1: Download project
      - name: Checkout Repository
        uses: actions/checkout@v4

      # STEP 2: Check Administrator Permissions
      - name: Check Administrator
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)

          $admin = $principal.IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator
          )

          if (!$admin) {
            throw "Runner must run with Administrator permissions."
          }

          Write-Host "Administrator permissions: OK"

      # STEP 3: Verify Windows 11
      - name: Verify Windows 11
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $os = Get-CimInstance Win32_OperatingSystem
          $build = [int]$os.BuildNumber

          Write-Host "Operating System: $($os.Caption)"
          Write-Host "Version: $($os.Version)"
          Write-Host "Build: $build"

          if ($os.Caption -notmatch "Windows 11") {
            throw "This is not Windows 11."
          }

          if ($build -lt 22000) {
            throw "Windows 11 build verification failed."
          }

          if ($os.Caption -notmatch "Pro|Enterprise|Education") {
            throw "Windows edition cannot host Microsoft RDP."
          }

          Write-Host "Windows 11 edition: OK"

      # STEP 4: Verify 16 GB RAM
      - name: Verify RAM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $computer = Get-CimInstance Win32_ComputerSystem

          $ram = [math]::Round(
            $computer.TotalPhysicalMemory / 1GB, 2
          )

          Write-Host "Installed RAM: $ram GB"

          if ($ram -lt 16) {
            throw "Minimum 16 GB RAM required."
          }

          Write-Host "RAM verification: OK"

      # STEP 5: Verify Internet
      - name: Internet Verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($hostName in @(
            "github.com",
            "pkgs.tailscale.com",
            "microsoft.com"
          )) {
            $result = Test-NetConnection `
              -ComputerName $hostName `
              -Port 443 `
              -WarningAction SilentlyContinue

            if (!$result.TcpTestSucceeded) {
              throw "Internet connection failed: $hostName"
            }

            Write-Host "$hostName HTTPS connectivity: OK"
          }

      # STEP 6: Install Tailscale
      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $service = Get-Service Tailscale `
            -ErrorAction SilentlyContinue

          if (!$service) {
            $installer = "$env:TEMP\tailscale-setup.exe"

            Invoke-WebRequest `
              "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
              -OutFile $installer

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList "/quiet" `
              -Wait -PassThru

            if ($process.ExitCode -ne 0) {
              throw "Tailscale installation failed."
            }
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $ts)) {
            throw "Tailscale executable missing."
          }

          Start-Service Tailscale

          Write-Host "Tailscale installation: OK"

      # STEP 7: Authenticate Tailscale
      - name: Tailscale Authentication
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace(
            $env:TAILSCALE_AUTHKEY
          )) {
            throw "Add TAILSCALE_AUTHKEY to GitHub Secrets."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            "--auth-key=$env:TAILSCALE_AUTHKEY" `
            "--hostname=fdr-windows-usa" `
            "--accept-dns=true"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale authentication failed."
          }

          $ip = (& $ts ip -4 | Select-Object -First 1).Trim()

          if (!$ip) {
            throw "Tailscale IP not found."
          }

          "FDR_TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host "Tailscale connected successfully."
          Write-Host "Private IP: $ip"

      # STEP 8: Generate Random Credentials
      - name: Create Random RDP User
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $username = "FDR" + (
            [guid]::NewGuid().ToString("N").Substring(0,8)
          )

          $chars = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*"

          $bytes = New-Object byte[] 32
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
          $rng.GetBytes($bytes)

          $passwordChars = for ($i = 0; $i -lt 32; $i++) {
            $chars[[int]$bytes[$i] % $chars.Length]
          }

          $password = -join $passwordChars
          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser `
            -Name $username `
            -Password $secure `
            -Description "FDR dedicated remote desktop account"

          Add-LocalGroupMember `
            -SID "S-1-5-32-555" `
            -Member $username

          # Encrypt credentials using Windows machine DPAPI.
          Add-Type -AssemblyName System.Security

          $folder = "$env:ProgramData\FDR-RDP"

          New-Item -ItemType Directory -Path $folder -Force |
            Out-Null

          $payload = @{
            Username = $username
            Password = $password
            Created = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json

          $plainBytes = [Text.Encoding]::UTF8.GetBytes($payload)

          $encrypted = [Security.Cryptography.ProtectedData]::Protect(
            $plainBytes,
            $null,
            [Security.Cryptography.DataProtectionScope]::LocalMachine
          )

          [IO.File]::WriteAllBytes(
            "$folder\credentials.dpapi",
            $encrypted
          )

          icacls $folder /inheritance:r `
            /grant:r "*S-1-5-18:(OI)(CI)F" `
            "*S-1-5-32-544:(OI)(CI)F"

          if ($LASTEXITCODE -ne 0) {
            throw "Credential file security failed."
          }

          Write-Host "RDP account created: $username"
          Write-Host "Password saved in encrypted local storage."
          Write-Host "Password is not printed in workflow logs."

      # STEP 9: Enable RDP
      - name: Configure Windows Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name UserAuthentication `
            -Value 1

          Set-Service TermService -StartupType Automatic

          Start-Service TermService

          # Disable broad built-in RDP firewall rules.
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule

          # Remove previous FDR rule.
          Get-NetFirewallRule `
            -DisplayName "FDR RDP Tailscale Only" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          # Allow RDP only from Tailscale IPv4 range.
          New-NetFirewallRule `
            -DisplayName "FDR RDP Tailscale Only" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any

          Write-Host "RDP enabled."
          Write-Host "Network Level Authentication enabled."
          Write-Host "Firewall restricted to Tailscale."

      # STEP 10: Final Verification
      - name: Final System Verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $rdp = Get-Service TermService

          if ($rdp.Status -ne "Running") {
            throw "RDP service is not running."
          }

          $nla = Get-ItemPropertyValue `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name UserAuthentication

          if ($nla -ne 1) {
            throw "NLA is not enabled."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts status

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale verification failed."
          }

          Write-Host "RDP service: OK"
          Write-Host "NLA: OK"
          Write-Host "Tailscale: OK"
          Write-Host "Final verification successful."

      # STEP 11: Display Connection Information
      - name: FDR RDP Connection Details
        shell: pwsh
        run: |
          Write-Host "===================================="
          Write-Host "FDR WINDOWS RDP"
          Write-Host "===================================="

          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "Tailscale IP: $env:FDR_TAILSCALE_IP"
          Write-Host "Username: Retrieve from local encrypted credentials"
          Write-Host "Password: Retrieve from local encrypted credentials"
          Write-Host "Port: 3389"
          Write-Host "Security: Tailscale private network"
          Write-Host "===================================="

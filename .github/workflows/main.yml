
name: Windows RDP

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create RDP User
        shell: pwsh
        run: |
          $chars = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*'

          $password = -join (1..24 | ForEach-Object {
            $chars[(Get-Random -Maximum $chars.Length)]
          })

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser `
            -Name "RDPUser" `
            -Password $securePassword `
            -Description "Temporary RDP account"

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDPUser"

          "RDP_USERNAME=RDPUser" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Verify Windows Setup
        shell: pwsh
        run: |
          Write-Host "Windows environment ready."
          Write-Host "RDP user created successfully."
          Write-Host "Runner computer: $env:COMPUTERNAME"
          Write-Host "RDP port: 3389"
          Write-Host "GitHub runner is temporary."

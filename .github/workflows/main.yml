# FDR ALL-IN-ONE WINDOWS RDP + TAILSCALE
# Run as Administrator on your own Windows 11 Pro VPS

$ErrorActionPreference = "Continue"

Write-Host "=== FDR RDP AUTO CONFIGURATION ===" -ForegroundColor Cyan

# 1. Administrator verification
$admin = ([Security.Principal.WindowsPrincipal] `
[Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole(
[Security.Principal.WindowsBuiltInRole]::Administrator)

if (!$admin) {
    throw "Please run PowerShell as Administrator"
}

# 2. Windows edition check
$os = Get-CimInstance Win32_OperatingSystem
Write-Host "OS: $($os.Caption)"

if ($os.Caption -notmatch "Pro|Enterprise|Education") {
    throw "Windows Pro or supported Enterprise/Education edition required."
}

# 3. Hardware verification
$ram = [math]::Round(
(Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2
)
$disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"

Write-Host "RAM: $ram GB"
Write-Host "Disk: $([math]::Round($disk.Size/1GB,2)) GB"

# 4. Create random account
$random = [guid]::NewGuid().ToString("N").Substring(0,10)
$username = "FDR$random"

$chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*"
$password = -join (1..28 | ForEach-Object {
    $chars[[Security.Cryptography.RandomNumberGenerator]::GetInt32($chars.Length)]
})

$secure = ConvertTo-SecureString $password -AsPlainText -Force

New-LocalUser -Name $username -Password $secure `
-Description "FDR Remote Desktop User"

Add-LocalGroupMember -SID "S-1-5-32-555" -Member $username

# 5. Enable Remote Desktop
Set-ItemProperty `
"HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
-Name fDenyTSConnections -Value 0

Set-ItemProperty `
"HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
-Name UserAuthentication -Value 1

# 6. RDP service
Set-Service TermService -StartupType Automatic
Start-Service TermService

# 7. Firewall - allow RDP only through Tailscale
New-NetFirewallRule -DisplayName "FDR RDP Tailscale Only" `
-Direction Inbound -Protocol TCP -LocalPort 3389 `
-RemoteAddress 100.64.0.0/10 -Action Allow `
-Profile Any -ErrorAction SilentlyContinue

# Disable broad built-in RDP inbound rules
Get-NetFirewallRule -DisplayGroup "Remote Desktop" `
-ErrorAction SilentlyContinue |
Where-Object {$_.Direction -eq "Inbound"} |
Disable-NetFirewallRule

# 8. Install Tailscale
$ts = Get-Service Tailscale -ErrorAction SilentlyContinue

if (!$ts) {
    $installer = "$env:TEMP\tailscale-setup.exe"

    Invoke-WebRequest `
    "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
    -OutFile $installer

    Start-Process $installer -ArgumentList "/quiet" -Wait
}

# 9. Start Tailscale
Set-Service Tailscale -StartupType Automatic `
-ErrorAction SilentlyContinue

Start-Service Tailscale -ErrorAction SilentlyContinue

# 10. Authentication
Write-Host ""
Write-Host "Tailscale authentication may be required."
Write-Host "Open the Tailscale login window and authorize this machine."

Start-Process "C:\Program Files\Tailscale\tailscale-ipn.exe" `
-ErrorAction SilentlyContinue

# 11. Wait for connection
Start-Sleep -Seconds 8

$tsExe = "C:\Program Files\Tailscale\tailscale.exe"
$tsIP = ""

if (Test-Path $tsExe) {
    $tsIP = (& $tsExe ip -4 2>$null | Select-Object -First 1)
}

# 12. Test RDP listener
Start-Sleep -Seconds 3

$listener = Get-NetTCPConnection `
-LocalPort 3389 -State Listen -ErrorAction SilentlyContinue

# 13. Final report
Write-Host ""
Write-Host "======= FDR RDP REPORT =======" -ForegroundColor Green

Write-Host "Username: $username"
Write-Host "Password: $password"
Write-Host "Tailscale IP: $tsIP"
Write-Host "RDP Port: 3389"
Write-Host "RAM: $ram GB"
Write-Host "RDP Listener: $([bool]$listener)"

if ($tsIP) {
    Write-Host "Connect using: $tsIP"
} else {
    Write-Host "Tailscale login/connection pending."
}

Write-Host ""
Write-Host "Save these credentials securely."
Write-Host "FDR setup finished."
